[project]
name = "pysaview"
version = "0.1.0"
description = "SuperADAM NeXus file inspection and quick plotting"
requires-python = ">=3.12,<3.13"
dependencies = ["PyQt6>=6.7", "pyqtgraph>=0.13.7", "numpy>=2.0", "h5py>=3.11", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.gui-scripts]
pysaview = "pySAview.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pySAview*"]
exclude = ["pySAview.tests*"]

[tool.setuptools.package-data]
pySAview = ["resources/*.svg", "example_data/*.nxs"]

[tool.pytest.ini_options]
testpaths = ["pySAview/tests"]
pythonpath = ["."]
qt_api = "pyqt6"
addopts = "-p no:cacheprovider"
